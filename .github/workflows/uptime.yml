name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check readiness
        env:
          UPTIME_URL: ${{ secrets.UPTIME_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
        run: |
          set -eu
          URL="${UPTIME_URL%/}/health/ready"
          if curl -fsS --max-time 15 "$URL" >/tmp/ready.json; then
            echo "OK: $(cat /tmp/ready.json)"
            exit 0
          fi
          echo "Readiness check failed for $URL"
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚨 SPARK readiness failed: ${URL}" >/dev/null || true
          fi
          exit 1
