name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_test_password
          POSTGRES_DB: spark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spark -d spark_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://spark:spark_test_password@127.0.0.1:5432/spark_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend

  e2e-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/package-deploy.js
      - run: node --test tests/e2e_verification.test.mjs tests/api_contract.test.mjs
      - run: docker compose config --quiet

  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: |
          cd frontend
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/ >/dev/null && break; sleep 2; done
          FRONTEND_URL=http://127.0.0.1:3100 python3 ../tests/frontend_smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spark-backend:ci backend
      - run: docker build -t spark-frontend:ci frontend
