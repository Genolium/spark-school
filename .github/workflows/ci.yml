name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_test_password
          POSTGRES_DB: spark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spark -d spark_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://spark:spark_test_password@127.0.0.1:5432/spark_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 ./...
        working-directory: backend
      - name: Go vulnerability scan
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Restore drill against a real dump
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark_test_password
          POSTGRES_DB: spark_test
          PGPASSWORD: spark_test_password
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U spark -d spark_test -v ON_ERROR_STOP=1 \
            -c "INSERT INTO users (telegram_id, first_name, has_access) VALUES (999999, 'Restore Drill', TRUE) ON CONFLICT (telegram_id) DO NOTHING"
          psql -h 127.0.0.1 -U spark -d spark_test -v ON_ERROR_STOP=1 \
            -c "INSERT INTO payment_transactions (payment_id, amount, status, tier, currency) VALUES ('RESTORE_DRILL', 1, 'SUCCESS', 'accelerator', 'RUB') ON CONFLICT (payment_id) DO NOTHING"
          mkdir -p /tmp/spark-backups
          pg_dump -h 127.0.0.1 -U spark -d spark_test | gzip > /tmp/spark-backups/spark_test.sql.gz
          chmod +x scripts/restore-drill.sh
          scripts/restore-drill.sh /tmp/spark-backups/spark_test.sql.gz 2>&1 | tee /tmp/restore-drill.log
          echo "### Restore drill" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/restore-drill.log >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/package-deploy.js
      - run: node --test tests/e2e_verification.test.mjs tests/api_contract.test.mjs
      - run: docker compose config --quiet

  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: |
          cd frontend
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/ >/dev/null && break; sleep 2; done
          FRONTEND_URL=http://127.0.0.1:3100 python3 ../tests/frontend_smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spark-backend:ci backend
      - run: docker build -t spark-frontend:ci frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spark-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spark-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
