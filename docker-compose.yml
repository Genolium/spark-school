services:
  caddy:
    image: caddy:2-alpine
    container_name: spark_caddy
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-38080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - spark_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spark_backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-127.0.0.1:38088}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-spark_user}:${POSTGRES_PASSWORD:-StrongPassword2026}@postgres:5432/${POSTGRES_DB:-spark_db}?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_API_SERVER=${TELEGRAM_API_SERVER:-}
      - TELEGRAM_INVITE_LINK=${TELEGRAM_INVITE_LINK:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-0}
      - JWT_SECRET=${JWT_SECRET:-super-secret-spark-jwt-key-2027}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-123456789}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-SparkAdmin2026!}
      - DOMAIN=${DOMAIN:-so-called-spark.ru}
      - FRONTEND_URL=https://${DOMAIN:-so-called-spark.ru}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media:ro
    networks:
      - spark_network

  # n8n — Visual Telegram Bot Builder & Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: spark_n8n
    restart: unless-stopped
    ports:
      - "${PORT_N8N:-38567}:5678"
    environment:
      - N8N_HOST=n8n.${DOMAIN:-so-called-spark.ru}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.${DOMAIN:-so-called-spark.ru}/}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.${DOMAIN:-so-called-spark.ru}/}
      - N8N_TRUST_PROXY=${N8N_TRUST_PROXY:-true}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-1}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Moscow}
      - TZ=${TIMEZONE:-Europe/Moscow}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - spark_network

  # (Optional) Standalone Go Bot worker — activated via --profile go-bot
  bot:
    profiles: ["go-bot"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spark_bot
    restart: unless-stopped
    command: ["/app/spark-bot"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-spark_user}:${POSTGRES_PASSWORD:-StrongPassword2026}@postgres:5432/${POSTGRES_DB:-spark_db}?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DOMAIN=${DOMAIN:-so-called-spark.ru}
      - FRONTEND_URL=https://${DOMAIN:-so-called-spark.ru}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-so-called-spark.ru}/api/v1
        - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME:-spark_prep_bot}
    container_name: spark_frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-127.0.0.1:38300}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-so-called-spark.ru}/api/v1
      - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME:-spark_prep_bot}
    networks:
      - spark_network

  postgres:
    image: postgres:16-alpine
    container_name: spark_postgres
    restart: unless-stopped
    ports:
      - "${PORT_POSTGRES:-127.0.0.1:38543}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword2026}
      POSTGRES_DB: ${POSTGRES_DB:-spark_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spark_user} -d ${POSTGRES_DB:-spark_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spark_network

  postgres_backup:
    image: postgres:16-alpine
    container_name: spark_postgres_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-spark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword2026}
      POSTGRES_DB: ${POSTGRES_DB:-spark_db}
      BACKUP_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKUP_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_ID:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - pgbackups:/backups
    entrypoint: |
      sh -c "
        echo '0 3 * * * /backup.sh' > /etc/crontabs/root
        echo 'Running initial backup at startup...'
        /backup.sh || true
        echo 'Starting crond daemon for daily 03:00 UTC backups...'
        crond -f -l 2
      "
    networks:
      - spark_network

networks:
  spark_network:
    driver: bridge

volumes:
  pgdata:
  pgbackups:
  caddy_data:
  caddy_config:
  n8n_data:
