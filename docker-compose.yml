services:
  caddy:
    image: caddy:2-alpine
    container_name: spark_caddy
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-38080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - spark_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spark_backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-127.0.0.1:38088}:8080"
    environment:
      - ENV=${ENV:-development}
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-spark_user}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-spark_db}?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_API_SERVER=${TELEGRAM_API_SERVER:-}
      - TELEGRAM_INVITE_LINK=${TELEGRAM_INVITE_LINK:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-0}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-0}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DOMAIN=${DOMAIN:-so-called-spark.ru}
      - FRONTEND_URL=https://${DOMAIN:-so-called-spark.ru}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - TRIBUTE_API_KEY=${TRIBUTE_API_KEY:-}
      - ENOT_SECRET_KEY=${ENOT_SECRET_KEY:-}
      - ENOT_SHOP_ID=${ENOT_SHOP_ID:-}
      - ANTILOPAY_PUBLIC_KEY=${ANTILOPAY_PUBLIC_KEY:-}
      - ANTILOPAY_SECRET_ID=${ANTILOPAY_SECRET_ID:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - ZOOM_MEETING_URL=${ZOOM_MEETING_URL:-}
      - DIGEST_HOUR=${DIGEST_HOUR:-21}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media:ro
    networks:
      - spark_network

  # (Optional) Standalone Go Bot worker — activated via --profile go-bot
  bot:
    profiles: ["go-bot"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spark_bot
    restart: unless-stopped
    command: ["/app/spark-bot"]
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-spark_user}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-spark_db}?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_API_SERVER=${TELEGRAM_API_SERVER:-}
      - TELEGRAM_INVITE_LINK=${TELEGRAM_INVITE_LINK:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-0}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-0}
      - DOMAIN=${DOMAIN:-so-called-spark.ru}
      - FRONTEND_URL=https://${DOMAIN:-so-called-spark.ru}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - DIGEST_HOUR=${DIGEST_HOUR:-21}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - TRIBUTE_API_KEY=${TRIBUTE_API_KEY:-}
      - ANTILOPAY_PUBLIC_KEY=${ANTILOPAY_PUBLIC_KEY:-}
      - ZOOM_MEETING_URL=${ZOOM_MEETING_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spark_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-so-called-spark.ru}/api/v1
        - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME:-spark_prep_bot}
    container_name: spark_frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-127.0.0.1:38300}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-so-called-spark.ru}/api/v1
      - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME:-spark_prep_bot}
    networks:
      - spark_network

  postgres:
    image: postgres:16-alpine
    container_name: spark_postgres
    restart: unless-stopped
    ports:
      - "${PORT_POSTGRES:-127.0.0.1:38543}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-spark_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spark_user} -d ${POSTGRES_DB:-spark_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spark_network

  postgres_backup:
    image: postgres:16-alpine
    container_name: spark_postgres_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-spark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-spark_db}
      BACKUP_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKUP_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_API_SERVER: ${TELEGRAM_API_SERVER:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - pgbackups:/backups
    entrypoint: |
      sh -c "
        apk add --no-cache curl > /dev/null 2>&1 || true
        echo '0 3 * * * /backup.sh' > /etc/crontabs/root
        echo 'Running initial backup at startup...'
        /backup.sh || true
        echo 'Starting crond daemon for daily 03:00 UTC backups...'
        crond -f -l 2
      "
    networks:
      - spark_network

networks:
  spark_network:
    driver: bridge

volumes:
  pgdata:
  pgbackups:
  caddy_data:
  caddy_config:
